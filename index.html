<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To-Do">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="개인 To-Do List">
<title>📌 To-Do</title>
<style>
  :root{
    --ink:#3B2A30;
    --ink-2:#8C7A80;
    --ink-3:#B3A5AA;
    --line:#F1E4E8;
    --wine:#7D1D3F;
    --wine-mid:#9E2A50;
    --wine-deep:#5C122D;
    --wine-soft:#FBEDF1;
    --wine-tint:#F4DCE3;
    --rose:#C0284C;
    --rose-soft:#FDECEF;
    --amber:#B0720A;
    --amber-soft:#FFF3DC;
    --sage:#4C7A5E;
    --sage-soft:#EAF4EC;
    --card:#FFFFFF;
    --r:22px;
    --shadow:0 10px 30px rgba(125,29,63,.08), 0 2px 6px rgba(125,29,63,.04);
    --shadow-sm:0 3px 12px rgba(125,29,63,.07);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:16px;
    line-height:1.5;
    background:
      radial-gradient(1100px 700px at 6% -14%, #F9E4EA 0%, rgba(249,228,234,0) 62%),
      radial-gradient(900px 620px at 104% -6%, #F2E8EE 0%, rgba(242,232,238,0) 58%),
      radial-gradient(900px 700px at 50% 114%, #FFF3E6 0%, rgba(255,243,230,0) 60%),
      #FCF8F9;
    background-attachment:fixed;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  button,input,select{font-family:inherit;}
  button{touch-action:manipulation;}
  h1,h2,p{margin:0;}

  /* ---------- 입장 ---------- */
  .gate{
    position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(59,42,48,.42);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .gate-card{
    width:100%;max-width:340px;background:#fff;border-radius:26px;
    padding:26px 24px 22px;box-shadow:0 24px 64px rgba(92,18,45,.32);text-align:center;
  }
  .gate-mark{
    width:54px;height:54px;margin:0 auto 12px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;font-size:26px;
    background:linear-gradient(160deg,var(--wine-soft),var(--wine-tint));
  }
  .gate-title{margin:0 0 6px;font-size:19px;font-weight:900;color:var(--wine-deep);letter-spacing:-.02em;}
  .gate-sub{margin:0 0 18px;font-size:13px;color:var(--ink-2);line-height:1.55;}
  .gate-input{
    width:100%;text-align:center;letter-spacing:.5em;text-indent:.5em;
    font-size:26px;font-weight:800;color:var(--wine-deep);padding:12px 10px;
    border:2px solid var(--wine-tint);border-radius:16px;background:#FFFAFB;
  }
  .gate-input:focus{outline:none;border-color:var(--wine-mid);background:#fff;}
  .gate-btn{
    width:100%;margin-top:11px;padding:14px;border:0;border-radius:16px;cursor:pointer;
    background:linear-gradient(160deg,var(--wine-mid),var(--wine-deep));color:#fff;
    font-size:15.5px;font-weight:800;letter-spacing:-.01em;
    box-shadow:0 8px 20px rgba(125,29,63,.26);
  }
  .gate-btn:active{transform:translateY(1px);}
  .gate-msg{min-height:18px;margin:11px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-2);}
  .gate-msg.err{color:var(--rose);}
  .gate-foot{margin:14px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.5;}

  /* ---------- 레이아웃 ---------- */
  .wrap{max-width:780px;margin:0 auto;padding:0 16px;}
  .top{
    position:sticky;top:0;z-index:30;
    margin:0 -16px 14px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
    background:rgba(255,255,255,.72);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.85);
  }
  .top-inner{max-width:748px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;}
  .brand{font-size:22px;font-weight:900;letter-spacing:-.03em;color:var(--wine-deep);line-height:1.2;}
  .date-line{margin-top:3px;font-size:13px;font-weight:700;color:var(--ink-2);}
  .top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .progress{min-width:104px;}
  .progress-txt{font-size:12px;font-weight:800;color:var(--ink-2);text-align:right;white-space:nowrap;}
  .progress-txt b{color:var(--wine);font-weight:900;}
  .bar{margin-top:5px;height:5px;border-radius:99px;background:var(--wine-soft);overflow:hidden;}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--wine-mid),var(--wine));transition:width .35s ease;}
  .pill{
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
    padding:6px 11px;border-radius:99px;font-size:12px;font-weight:800;
    background:var(--wine-soft);color:var(--wine);
  }
  .pill.sync.on{background:var(--sage-soft);color:var(--sage);}
  .pill.sync.wait{background:var(--amber-soft);color:var(--amber);}
  .pill.sync.off{background:#F3EDEF;color:var(--ink-2);}

  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9);}
  .add-card{padding:14px;}
  .add-text{
    width:100%;border:1.5px solid var(--line);background:#FDFAFB;border-radius:14px;
    padding:12px 14px;font-size:15.5px;color:var(--ink);
  }
  .add-text::placeholder{color:var(--ink-3);}
  .add-text:focus{outline:none;border-color:var(--wine-tint);background:#fff;box-shadow:0 0 0 4px rgba(125,29,63,.06);}
  .add-row{display:flex;align-items:center;gap:8px;margin-top:9px;}
  .datefield{
    position:relative;display:flex;align-items:center;flex:0 0 auto;
    border:1.5px solid var(--line);background:#FDFAFB;border-radius:12px;padding:0 10px;
    height:38px;color:var(--ink);
  }
  .datefield:focus-within{border-color:var(--wine-tint);background:#fff;}
  .datefield .cal{font-size:13px;margin-right:5px;opacity:.7;}
  .datefield input[type=date]{
    border:0;background:transparent;font-size:13.5px;font-weight:700;color:var(--ink);
    padding:0;width:118px;min-width:0;height:100%;
  }
  .datefield input[type=date]:focus{outline:none;}
  .datefield input[type=date]::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer;margin-left:2px;}
  .datefield .ph{
    position:absolute;left:30px;right:26px;top:1px;bottom:1px;
    display:flex;align-items:center;background:#FDFAFB;border-radius:11px;
    font-size:13.5px;font-weight:700;color:var(--ink-3);pointer-events:none;
  }
  .datefield.has .ph,.datefield:focus-within .ph{display:none;}
  .datefield .clear{
    border:0;background:#EFE4E8;color:var(--ink-2);border-radius:99px;
    width:19px;height:19px;line-height:1;font-size:11px;font-weight:900;
    display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;margin-left:4px;
  }
  .datefield.has .clear{display:flex;}
  .seg{display:flex;gap:4px;margin-left:auto;background:#FAF5F6;border-radius:12px;padding:3px;}
  .seg button{
    border:0;background:transparent;border-radius:9px;cursor:pointer;
    padding:6px 9px;font-size:12.5px;font-weight:800;color:var(--ink-2);
    display:inline-flex;align-items:center;gap:3px;white-space:nowrap;
  }
  .seg button[aria-checked=true]{background:#fff;color:var(--wine-deep);box-shadow:0 2px 6px rgba(125,29,63,.13);}
  .seg button[data-pri=high][aria-checked=true]{color:var(--rose);}
  .seg button[data-pri=low][aria-checked=true]{color:var(--sage);}
  .add-btn{
    flex:0 0 auto;border:0;border-radius:12px;cursor:pointer;height:38px;padding:0 16px;
    background:linear-gradient(160deg,var(--wine-mid),var(--wine-deep));color:#fff;
    font-size:14px;font-weight:800;box-shadow:0 6px 16px rgba(125,29,63,.22);
  }
  .add-btn:active{transform:translateY(1px);}

  .list-card{margin-top:14px;overflow:hidden;}
  .list-head{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;
    padding:12px 14px 10px;border-bottom:1px solid #FAF1F3;
  }
  .filters{display:flex;gap:6px;}
  .filters button{
    border:0;background:#FAF5F6;color:var(--ink-2);cursor:pointer;
    padding:7px 12px;border-radius:99px;font-size:13px;font-weight:800;
    display:inline-flex;align-items:center;gap:5px;
  }
  .filters button b{font-weight:900;opacity:.75;font-size:11.5px;}
  .filters button[aria-pressed=true]{background:var(--wine);color:#fff;box-shadow:0 4px 12px rgba(125,29,63,.22);}
  .filters button[aria-pressed=true] b{opacity:.85;}
  .sortsel{
    border:1.5px solid var(--line);border-radius:10px;background:#FDFAFB;color:var(--ink-2);
    font-size:12.5px;font-weight:800;padding:6px 8px;cursor:pointer;
  }
  .sortsel:focus{outline:none;border-color:var(--wine-tint);}

  ul.list{list-style:none;margin:0;padding:6px 8px 10px;}
  .item{
    display:flex;align-items:flex-start;gap:10px;
    padding:11px 8px 11px 6px;border-radius:14px;position:relative;
  }
  .item + .item{border-top:1px solid #FBF3F5;}
  .item:hover{background:#FEFAFB;}
  .item.done{opacity:.92;}
  .check{
    flex:0 0 auto;width:24px;height:24px;margin-top:1px;border-radius:50%;cursor:pointer;
    border:2px solid #E2CBD2;background:#fff;padding:0;position:relative;
    transition:background .15s,border-color .15s;
  }
  .check:hover{border-color:var(--wine-mid);background:var(--wine-soft);}
  .check[aria-pressed=true]{background:var(--wine);border-color:var(--wine);}
  .check[aria-pressed=true]::after{
    content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg);
  }
  .body{flex:1 1 auto;min-width:0;}
  .title{
    font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.4;
    letter-spacing:-.01em;cursor:text;word-break:keep-all;overflow-wrap:anywhere;
    padding:1px 0;border-radius:6px;
  }
  .title:hover{color:var(--wine-deep);}
  .item.done .title{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:#D8C3CA;}
  .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;}
  .badge{
    display:inline-flex;align-items:center;gap:4px;border-radius:7px;
    padding:2.5px 7px;font-size:11.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
  }
  .badge.due{background:#F6F1F3;color:var(--ink-2);}
  .badge.due.far{background:#F8F3F5;color:var(--ink-2);}
  .badge.due.near{background:var(--wine-soft);color:var(--wine);}
  .badge.due.soon{background:var(--amber-soft);color:var(--amber);}
  .badge.due.dday{background:#FDE7EC;color:var(--rose);}
  .badge.due.over{background:#FCE3E7;color:#9E1030;}
  .badge.pri{background:#F7F2F4;color:var(--ink-2);}
  .badge.pri.high{background:var(--rose-soft);color:var(--rose);}
  .badge.pri.mid{background:var(--wine-soft);color:var(--wine);}
  .badge.pri.low{background:var(--sage-soft);color:var(--sage);}
  .item.done .badge{opacity:.6;}
  .actions{flex:0 0 auto;display:flex;gap:2px;margin-top:-2px;opacity:0;transition:opacity .15s;}
  .item:hover .actions,.item:focus-within .actions{opacity:1;}
  .icon{
    border:0;background:transparent;cursor:pointer;border-radius:9px;
    width:32px;height:32px;font-size:14px;line-height:1;color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .icon:hover{background:var(--wine-soft);color:var(--wine);}
  .icon.del:hover{background:var(--rose-soft);color:var(--rose);}

  /* 수정 모드 */
  .editform{flex:1 1 auto;min-width:0;}
  .etext{
    width:100%;border:1.5px solid var(--wine-tint);border-radius:11px;background:#fff;
    padding:9px 11px;font-size:15px;font-weight:700;color:var(--ink);
  }
  .etext:focus{outline:none;box-shadow:0 0 0 4px rgba(125,29,63,.07);}
  .erow{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap;}
  .erow .datefield{height:34px;}
  .erow .datefield input[type=date]{font-size:13px;width:112px;}
  .erow .seg{padding:2px;margin-left:0;}
  .erow .seg button{padding:5px 8px;font-size:12px;}
  .mini{
    border:0;border-radius:9px;cursor:pointer;height:31px;padding:0 12px;
    font-size:12.5px;font-weight:800;
  }
  .mini.save{background:var(--wine);color:#fff;margin-left:auto;}
  .mini.cancel{background:#F5EEF0;color:var(--ink-2);}

  .empty{padding:34px 20px 40px;text-align:center;}
  .empty .ico{font-size:30px;opacity:.8;}
  .empty p{margin-top:8px;font-size:14px;font-weight:700;color:var(--ink-2);}
  .empty span{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-3);}

  footer{margin:16px 0 6px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
  .linkbtn{
    border:0;background:transparent;color:var(--ink-3);font-size:11.5px;font-weight:700;
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:4px;
  }
  .foot-note{font-size:11.5px;color:var(--ink-3);}

  .toast{
    position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
    z-index:90;display:flex;align-items:center;gap:12px;
    background:rgba(59,42,48,.94);color:#fff;border-radius:14px;padding:11px 16px;
    font-size:13.5px;font-weight:700;box-shadow:0 12px 30px rgba(59,42,48,.3);
    opacity:0;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast button{
    border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:8px;
    padding:5px 10px;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  }

  @media (hover:none){
    .actions{opacity:1;}
  }
  @media (max-width:520px){
    .wrap{padding:0 12px;}
    .top{margin:0 -12px 12px;padding:calc(12px + env(safe-area-inset-top)) 12px 10px;}
    .brand{font-size:20px;}
    .date-line{font-size:12.5px;}
    .progress{min-width:96px;}
    .add-card{padding:12px;}
    .add-row{gap:6px;}
    .datefield{padding:0 8px;}
    .datefield input[type=date]{width:104px;font-size:13px;}
    .datefield .ph{left:28px;font-size:13px;}
    .seg button{padding:6px 8px;font-size:12px;}
    .add-btn{padding:0 13px;}
    .item{padding:11px 4px 11px 4px;gap:9px;}
    .title{font-size:15px;}
    .actions{opacity:1;}
    .icon{width:30px;height:30px;}
    .filters button{padding:6px 10px;font-size:12.5px;}
  }
  @media (max-width:430px){
    .add-row{flex-wrap:wrap;}
    .datefield{flex:1 1 auto;min-width:0;}
    .datefield input[type=date]{width:auto;flex:1;}
    .seg{order:3;flex:1 1 100%;margin-left:0;}
    .seg button{flex:1 1 0;justify-content:center;}
  }
  @media (max-width:340px){
    .seg button span.lbl{display:none;}
  }
</style>
</head>
<body>

<!-- 입장 화면 -->
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <div class="gate-mark">📌</div>
    <h1 class="gate-title">To-Do 입장</h1>
    <p class="gate-sub">네 자리 코드를 입력해 주세요.<br>이 기기에서는 다음부터 자동으로 열려요.</p>
    <input class="gate-input" id="gatePin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-label="네 자리 코드" placeholder="••••">
    <button class="gate-btn" id="gateBtn" type="button">들어가기</button>
    <p class="gate-msg" id="gateMsg"></p>
    <p class="gate-foot">코드는 이 기기에만 저장되고, 서버에는 암호화된 값만 남아요.</p>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div class="top-inner">
      <div>
        <div class="brand">📌 To-Do</div>
        <div class="date-line" id="todayLine"></div>
      </div>
      <div class="top-right">
        <div class="progress">
          <div class="progress-txt" id="progressTxt"></div>
          <div class="bar"><i id="progressBar"></i></div>
        </div>
        <span class="pill sync wait" id="syncPill">🟠 연결 중</span>
      </div>
    </div>
  </header>

  <main>
    <section class="card add-card">
      <form id="addForm" autocomplete="off">
        <input class="add-text" id="addText" type="text" placeholder="할 일을 입력하세요" maxlength="200" aria-label="새 할 일">
        <div class="add-row">
          <div class="datefield" id="addDueField">
            <span class="cal">📅</span>
            <span class="ph">마감일</span>
            <input type="date" id="addDue" aria-label="마감일">
            <button type="button" class="clear" id="addDueClear" aria-label="마감일 지우기">✕</button>
          </div>
          <div class="seg" id="addPri" role="radiogroup" aria-label="중요도">
            <button type="button" data-pri="high" aria-checked="false" role="radio">🔥<span class="lbl">높음</span></button>
            <button type="button" data-pri="mid" aria-checked="true" role="radio">⭐<span class="lbl">보통</span></button>
            <button type="button" data-pri="low" aria-checked="false" role="radio">🌿<span class="lbl">낮음</span></button>
          </div>
          <button class="add-btn" type="submit">추가</button>
        </div>
      </form>
    </section>

    <section class="card list-card">
      <div class="list-head">
        <div class="filters" id="filters">
          <button type="button" data-filter="all" aria-pressed="true">전체 <b id="cntAll">0</b></button>
          <button type="button" data-filter="active" aria-pressed="false">진행 중 <b id="cntActive">0</b></button>
          <button type="button" data-filter="done" aria-pressed="false">완료 <b id="cntDone">0</b></button>
        </div>
        <select class="sortsel" id="sortSel" aria-label="정렬">
          <option value="due">마감 임박순</option>
          <option value="pri">중요도순</option>
          <option value="new">최근 추가순</option>
        </select>
      </div>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty" hidden>
        <div class="ico">🗒️</div>
        <p>여기는 비어 있어요</p>
        <span>위에서 할 일을 추가해 보세요.</span>
      </div>
    </section>

    <footer>
      <span class="foot-note" id="updatedLine"></span>
      <button class="linkbtn" id="changeCode" type="button">코드 다시 입력</button>
    </footer>
  </main>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastBtn" type="button" hidden>되돌리기</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  /* ============ 저장 ============ */

    for (var i = 0; i < list.length; i++) {
      var it = list[i];
      if (!it || typeof it !== 'object') continue;
      var text = String(it.text == null ? '' : it.text).slice(0, 200);
      if (!text.trim()) continue;
      var pri = it.pri === 'high' || it.pri === 'low' ? it.pri : 'mid';
      var due = parseDue(it.due) ? String(it.due) : null;
      out.items.push({
        id: String(it.id || uid()),
        text: text,
        due: due,
        pri: pri,
        done: !!it.done,

        doneTs: it.done ? (Number(it.doneTs) || null) : null

  function loadCache() {

  }

    try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  }

  /* ============ Supabase ============ */
  function haveLib() { return !!(window.supabase && typeof window.supabase.createClient === 'function'); }
  function sb() {
    if (!sbClient && haveLib()) {
      try {

          auth: { persistSession: false, autoRefreshToken: false },
          realtime: { params: { eventsPerSecond: 5 } }

  }
  function setSync(mode) {
    var p = el('#syncPill');
    if (!p) return;
    if (mode === 'on') { p.textContent = '🟢 실시간'; p.className = 'pill sync on'; }
    else if (mode === 'wait') { p.textContent = '🟠 연결 중'; p.className = 'pill sync wait'; }
    else if (mode === 'local') { p.textContent = '⚪ 오프라인'; p.className = 'pill sync off'; }
    else { p.textContent = '⚪ 오프라인'; p.className = 'pill sync off'; }
  }
  function fetchRoom() {
    var c = sb();
    if (!c) return Promise.reject(new Error('NO_LIB'));
    return c.from('dashboard_rooms')
      .select('room_key,state,updated_at')
      .eq('room_key', roomKey)
      .maybeSingle()
      .then(function (res) {
        if (res && res.error) throw new Error('FETCH');
        if (!res || !res.data) throw new Error('NOROOM');

      });

  function pushNow() {
    if (!roomKey) return;

    try { snap = JSON.parse(JSON.stringify(state)); } catch (e) { return; }
    try {

        .update({ state: snap, updated_at: new Date().toISOString() })
        .eq('room_key', roomKey)
        .then(function (res) {

    }
  }
  function watchRoom() {

        .on('postgres_changes',
          { event: '*', schema: 'public', table: 'dashboard_rooms', filter: 'room_key=eq.' + roomKey },
          function (payload) {

        .subscribe(function (status) {

  /* 끊겼다 돌아왔을 때: 서버 것을 먼저 받고, 이 기기에만 있던 항목은 살려서 합친다 */
  function resync() {
    if (!roomKey || !sb() || view.editing) return;

        setSync('on');
        return;
      }
      var remote = fresh;
      var local = state;
      var map = {}, i, it;
      for (i = 0; i < remote.items.length; i++) map[remote.items[i].id] = remote.items[i];
      for (i = 0; i < local.items.length; i++) {
        it = local.items[i];
        if (!map[it.id]) remote.items.push(it);
        else if (localOnly) map[it.id] = it;

      if (localOnly) {
        state = normalizeState(remote);
        saveCache();
        renderAll();
        queuePush();
      } else {

      }
      localOnly = false;
      setSync('on');
    }).catch(function () { setSync('local'); });
  }

  /* ============ 입장 ============ */

    }
  }
  function tryJoin(pin, isAuto) {

  /* ============ 정렬 / 필터 ============ */
  var PRI_RANK = { high: 0, mid: 1, low: 2 };
  function sortItems(list) {
    var arr = list.slice();
    arr.sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (view.sort === 'pri') {
        if (PRI_RANK[a.pri] !== PRI_RANK[b.pri]) return PRI_RANK[a.pri] - PRI_RANK[b.pri];
        var da = dueDiff(a.due), db = dueDiff(b.due);
        if (da === null && db !== null) return 1;
        if (db === null && da !== null) return -1;
        if (da !== null && db !== null && da !== db) return da - db;
        return (b.ts || 0) - (a.ts || 0);
      }
      if (view.sort === 'new') {
        return (b.ts || 0) - (a.ts || 0);
      }
      var x = dueDiff(a.due), y = dueDiff(b.due);
      if (x === null && y !== null) return 1;
      if (y === null && x !== null) return -1;
      if (x !== null && y !== null && x !== y) return x - y;
      if (PRI_RANK[a.pri] !== PRI_RANK[b.pri]) return PRI_RANK[a.pri] - PRI_RANK[b.pri];

    else if (d === -1) { cls = 'over'; txt = '지남'; }

    return { cls: cls, txt: txt, date: shortDate(due) };

    cancel.className = 'mini cancel';
    cancel.textContent = '취소';
    cancel.addEventListener('click', function () { view.editing = null; renderAll(); });
    row.appendChild(save);
    row.appendChild(cancel);
    form.appendChild(row);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = text.value.trim();
      if (!v) { text.focus(); return; }
      updateItem(it.id, { text: v, due: el('input[type=date]', dueField).value || null, pri: pri });
      view.editing = null;
      renderAll();
    });
    text.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { view.editing = null; renderAll(); }
    });
    setTimeout(function () {
      try { text.focus(); text.setSelectionRange(text.value.length, text.value.length); } catch (e) {}
    }, 20);
    return form;
  }

  function renderHeader() {
    var total = state.items.length;
    var done = state.items.filter(function (i) { return i.done; }).length;
    var active = total - done;
    el('#todayLine').textContent = todayLabel();
    el('#cntAll').textContent = total;
    el('#cntActive').textContent = active;
    el('#cntDone').textContent = done;
    el('#progressTxt').innerHTML = '<b>' + done + '</b> / ' + total + ' 완료';
    el('#progressBar').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
    var up = state.updatedAt ? new Date(state.updatedAt) : null;
    el('#updatedLine').textContent = (up && !isNaN(up.getTime()))
      ? '마지막 저장 ' + (up.getMonth() + 1) + '/' + up.getDate() + ' ' +
        (up.getHours() < 12 ? '오전 ' : '오후 ') + ((up.getHours() % 12) || 12) + ':' + pad2(up.getMinutes())
      : '';
  }

  function renderList() {
    var list = el('#list');
    var items = visibleItems();
    list.textContent = '';
    for (var i = 0; i < items.length; i++) list.appendChild(buildItem(items[i]));
    var empty = el('#empty');
    empty.hidden = items.length > 0;
    var hasAny = state.items.length > 0;
    if (!empty.hidden) {
      var t = el('p', empty), s = el('span', empty);
      if (view.filter === 'done') { t.textContent = '완료한 일이 아직 없어요'; s.textContent = '체크하면 여기에 쌓여요.'; }
      else if (view.filter === 'active') { t.textContent = '남은 일이 없어요 🎉'; s.textContent = '전부 끝냈어요!'; }
      else if (!hasAny) { t.textContent = '여기는 비어 있어요'; s.textContent = '위에서 할 일을 추가해 보세요.'; }
      else { t.textContent = '표시할 항목이 없어요'; s.textContent = ''; }
    }
    els('#filters button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-filter') === view.filter ? 'true' : 'false');
    });
  }

  function renderAll() {
    renderHeader();
    renderList();
  }

  /* ============ 동작 ============ */
  function touch() {
    state.updatedAt = Date.now();
    saveCache();
    renderAll();
    queuePush();
  }
  function toggleDone(id) {
    var it = find(id);
    if (!it) return;
    it.done = !it.done;
    it.doneTs = it.done ? Date.now() : null;
    touch();
  }
  function find(id) {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }
  function updateItem(id, patch) {
    var it = find(id);
    if (!it) return;
    if (typeof patch.text === 'string') it.text = patch.text.slice(0, 200);
    if ('due' in patch) it.due = parseDue(patch.due) ? patch.due : null;
    if (patch.pri) it.pri = patch.pri;
    touch();
  }
  function startEdit(id) { view.editing = id; renderAll(); }
  function removeItem(id) {
    var idx = -1, i;
    for (i = 0; i < state.items.length; i++) if (state.items[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    lastDeleted = { item: state.items[idx], index: idx };
    state.items.splice(idx, 1);
    if (view.editing === id) view.editing = null;
    touch();
    showToast('삭제했어요', true);
  }
  function restore() {
    if (!lastDeleted) return;
    var it = lastDeleted.item;
    var idx = Math.min(lastDeleted.index, state.items.length);
    if (find(it.id)) { state.updatedAt = Date.now(); saveCache(); renderAll(); return; }
    state.items.splice(idx, 0, it);
    lastDeleted = null;
    touch();
    showToast('되살렸어요', false);
  }
  function showToast(text, withUndo) {
    var t = el('#toast'), btn = el('#toastBtn');
    el('#toastText').textContent = text;
    btn.hidden = !withUndo;
    t.hidden = false;
    requestAnimationFrame(function () { t.classList.add('show'); });
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      t.classList.remove('show');
      setTimeout(function () { if (!t.classList.contains('show')) t.hidden = true; }, 220);
    }, withUndo ? 4200 : 1800);
  }

  /* ============ 이벤트 ============ */
  function bind() {
    /* 필터 */
    els('#filters button').forEach(function (b) {
      b.addEventListener('click', function () {
        view.filter = b.getAttribute('data-filter');
        view.editing = null;
        renderAll();
      });
    });
    /* 정렬 */
    el('#sortSel').addEventListener('change', function () {
      view.sort = el('#sortSel').value;
      renderAll();
    });
    /* 추가 폼 */
    var addDueField = el('#addDueField');
    el('#addDue').addEventListener('input', function () {
      addDueField.classList.toggle('has', !!el('#addDue').value);
    });
    el('#addDueClear').addEventListener('click', function () {
      el('#addDue').value = '';
      addDueField.classList.remove('has');
      el('#addDue').focus();
    });
    var addPri = 'mid';
    els('#addPri button').forEach(function (b) {
      b.addEventListener('click', function () {
        addPri = b.getAttribute('data-pri');
        els('#addPri button').forEach(function (x) {
          x.setAttribute('aria-checked', x === b ? 'true' : 'false');
        });
      });
    });
    el('#addForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = el('#addText');
      var v = input.value.trim();
      if (!v) { input.focus(); return; }
      state.items.push({
        id: uid(), text: v.slice(0, 200),
        due: el('#addDue').value || null,
        pri: addPri, done: false, ts: Date.now(), doneTs: null
      });
      input.value = '';
      el('#addDue').value = '';
      addDueField.classList.remove('has');
      addPri = 'mid';
      els('#addPri button').forEach(function (x) {
        x.setAttribute('aria-checked', x.getAttribute('data-pri') === 'mid' ? 'true' : 'false');
      });
      view.editing = null;
      touch();
      input.focus();
    });
    /* 토스트 되돌리기 */
    el('#toastBtn').addEventListener('click', function () { restore(); });
    /* 입장 */
    el('#gateBtn').addEventListener('click', submitGate);
    el('#gatePin').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submitGate(); }
    });
    el('#gatePin').addEventListener('input', function () {
      var v = el('#gatePin').value.replace(/[^0-9]/g, '').slice(0, 4);
      if (el('#gatePin').value !== v) el('#gatePin').value = v;
      gateMsg('');
      if (v.length === 4) submitGate();
    });
    /* 코드 다시 입력 */
    el('#changeCode').addEventListener('click', function () {
      forgetPin();
      joined = false;
      if (roomChan) { try { sbClient.removeChannel(roomChan); } catch (e) {} roomChan = null; }
      roomKey = '';
      setSync('local');
      showGate(true);
      gateMsg('새 코드를 입력해 주세요.');
    });
    /* 다른 기기 변경 따라잡기 */
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && roomKey) resync();
    });
    window.addEventListener('online', function () { if (roomKey) resync(); });
    window.addEventListener('focus', function () { if (roomKey && document.hasFocus()) resync(); });
  }

  function submitGate() {
    var pin = (el('#gatePin').value || '').trim();
    if (!/^[0-9]{4}$/.test(pin)) { gateMsg('네 자리 숫자를 입력해 주세요.', true); return; }
    el('#gateBtn').disabled = true;
    gateMsg('확인 중…');
    tryJoin(pin, false).then(function (ok) {
      el('#gateBtn').disabled = false;
      if (ok) { el('#gatePin').value = ''; }
    });
  }

  /* ============ 시작 ============ */
  function boot() {
    var cached = loadCache();
    if (cached) state = cached;
    renderAll();
    bind();
    var pin = savedPin();
    if (pin) {
      showGate(true, '연결 중…');
      tryJoin(pin, true);
    } else {
      showGate(true);
    }
    /* lib 로드가 늦는 경우를 대비 */
    setTimeout(function () {
      if (!joined && !roomKey && haveLib()) { /* 사용자가 코드 입력하면 그때 연결 */ }
    }, 1500);
    booted = true;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
